<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Five quick browser games about cats: swat things off a shelf, pounce on a laser dot, pick the perfect box, chase a patch of sunlight, and hop across a river without getting wet.">
<title>Nine Lives Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600&display=swap">
<style>
  /* Layout: one arcade-cabinet column. Game picker, score strip, play screen, then how-to-play. A 3 AM living room at night, lit by a marmalade cat. */
  :root {
    --night: #121830;
    --panel: #1b2340;
    --panel-hi: #253061;
    --line: #2f3a68;
    --floor: #1a1f38;
    --fur: #f6efe4;
    --muted: #9ba6cf;
    --marmalade: #ff9b3d;
    --stripe: #d0701f;
    --pink: #ff9fb2;
    --eye: #c9e35a;
    --ink: #15131a;
    --laser: #ff2d55;
    --leaf: #5fbf7f;
    --wood: #7a5236;
    --glass: rgba(170, 220, 255, 0.45);
    --vase: #5e8bff;
    --skin: #e8b796;
    --hair: #3b2a22;
    --shirt: #4b5fa8;
    --box: #c99a5a;
    --box-dark: #8a6232;
    --sun: #ffd65a;
    --water: #1f4a78;
    --water-hi: #3b75b0;
    --grass: #2e5a3c;
    --sand: #b99a62;
    --bark: #4f331f;
    --scrim: rgba(13, 18, 38, 0.76);
    --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--night); color: var(--fur); }
  body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .wrap {
    max-width: 860px; margin: 0 auto; display: grid; gap: 20px;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: grid; gap: 8px; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0; line-height: 1;
    font-size: clamp(2.3rem, 7.5vw, 3.8rem); color: var(--marmalade); text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); max-width: 58ch; }
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 760px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tab {
    appearance: none; font: inherit; color: var(--fur); text-align: left; cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: grid; gap: 2px; align-content: start;
    transition: border-color .15s, background .15s;
  }
  .tab b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; line-height: 1.15; }
  .tab span { color: var(--muted); font-size: .86rem; line-height: 1.3; }
  .tab:hover { border-color: var(--muted); }
  .tab[aria-selected="true"] { border-color: var(--marmalade); background: var(--panel-hi); }
  .tab:focus-visible, canvas:focus-visible { outline: 3px solid var(--eye); outline-offset: 3px; }
  .cabinet {
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    padding: 12px; display: grid; gap: 10px;
  }
  .hud { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; margin: 0; padding: 2px 6px; }
  .stat { display: flex; gap: 8px; align-items: baseline; }
  .stat dt { text-transform: uppercase; letter-spacing: .09em; font-size: .72rem; color: var(--muted); }
  .stat dd { margin: 0; font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .stat:last-child { margin-left: auto; }
  .stat:last-child dd { color: var(--eye); }
  canvas {
    display: block; width: 100%; max-width: 100%; height: 360px; border-radius: 12px;
    background: var(--night); touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .rules { display: grid; gap: 4px; max-width: 65ch; padding-inline: 4px; }
  .rules h2 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; margin: 0; color: var(--marmalade); text-wrap: balance; }
  .rules p { margin: 0; color: var(--fur); }
  .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .board { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
  .board h2 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; margin: 0; color: var(--marmalade); text-wrap: balance; }
  .board-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .board-list li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .board-list .rk { color: var(--muted); font-weight: 600; }
  .board-list li:first-child .rk { color: var(--marmalade); }
  .board-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-list .sc { font-family: var(--display); }
  .board-list li.me { background: var(--panel-hi); box-shadow: inset 0 0 0 2px var(--marmalade); }
  .msg { margin: 0; color: var(--muted); font-size: .92rem; }
  .msg.err { color: var(--pink); }
  .submit { display: grid; gap: 8px; padding: 2px 6px 4px; }
  .submit label { font-weight: 600; }
  .submit label b { font-family: var(--display); font-weight: 400; color: var(--marmalade); font-size: 1.2rem; }
  .submit .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .submit input { flex: 1 1 180px; min-width: 0; font: inherit; color: var(--fur); background: var(--night); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .submit input::placeholder { color: var(--muted); }
  .submit button { font: inherit; font-weight: 600; color: var(--ink); background: var(--marmalade); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  .submit button[disabled] { opacity: .6; cursor: default; }
  .submit input:focus-visible, .submit button:focus-visible { outline: 3px solid var(--eye); outline-offset: 2px; }
  footer { color: var(--muted); font-size: .85rem; padding-inline: 4px; }
  @media (max-width: 560px) {
    .tab { text-align: center; padding: 10px 6px; }
    .tab b { font-size: .98rem; }
    .tab span { display: none; }
    .stat:last-child { margin-left: 0; }
  }
  @media (max-width: 700px) { .below { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <header>
    <h1>Nine Lives Arcade</h1>
    <p>Five quick games about cats doing exactly what they want.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Games">
    <button class="tab" id="tab-knock" role="tab" data-game="knock" aria-selected="true"><b>Knock It Off</b><span>Gravity, tested one mug at a time</span></button>
    <button class="tab" id="tab-laser" role="tab" data-game="laser" aria-selected="false"><b>Laser Pounce</b><span>Catch the red dot. Finally.</span></button>
    <button class="tab" id="tab-box" role="tab" data-game="box" aria-selected="false"><b>If It Fits, I Sits</b><span>Judge the box. Claim the box.</span></button>
    <button class="tab" id="tab-sun" role="tab" data-game="sun" aria-selected="false"><b>Catch the Sun</b><span>Find the warm spot. Nap in it.</span></button>
    <button class="tab" id="tab-river" role="tab" data-game="river" aria-selected="false"><b>Dry Paws</b><span>Hop the logs. Stay dry.</span></button>
  </nav>

  <section class="cabinet" aria-label="Game">
    <dl class="hud">
      <div class="stat"><dt id="l0">Score</dt><dd id="v0">0</dd></div>
      <div class="stat"><dt id="l1">Time</dt><dd id="v1">30s</dd></div>
      <div class="stat"><dt id="l2">Strikes</dt><dd id="v2">0 / 3</dd></div>
      <div class="stat"><dt id="l3">Best</dt><dd id="v3">0</dd></div>
    </dl>
    <canvas id="stage" tabindex="0" aria-label="Game screen. Click or tap to play; Space or Enter starts a round. In Catch the Sun, arrow keys move the cat."></canvas>
    <form id="submit-form" class="submit" hidden>
      <label for="nick">You scored <b id="submit-score">0</b>. Put it on the leaderboard:</label>
      <div class="row">
        <input id="nick" name="nick" maxlength="12" autocomplete="nickname" placeholder="Your nickname" required>
        <button type="submit" id="submit-btn">Submit score</button>
      </div>
      <p id="submit-msg" class="msg" role="status"></p>
    </form>
  </section>

  <div class="below">
    <section class="board" aria-labelledby="board-title">
      <h2 id="board-title">Top 10</h2>
      <ol id="board-list" class="board-list"></ol>
      <p id="board-msg" class="msg" role="status">Loading scores…</p>
    </section>
    <section class="rules">
      <h2 id="rules-title">How to play</h2>
      <p id="rules"></p>
    </section>
  </div>

  <footer>Leaderboard names are public, so skip your real name. Your personal best is saved in this browser.</footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const rootStyle = getComputedStyle(document.documentElement);
  const C = {};
  ['night','panel','panelHi','line','floor','fur','muted','marmalade','stripe','pink','eye','ink','laser','leaf','wood','glass','vase','skin','hair','shirt','box','boxDark','scrim','sun','water','waterHi','grass','sand','bark']
    .forEach(k => { C[k] = rootStyle.getPropertyValue('--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())).trim(); });
  const DISPLAY = '"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif';
  const BODY = '"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif';
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tapWord = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click';

  let W = 640, H = 400;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const unit = () => Math.min(W, H * 1.5);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || 640;
    H = Math.round(clamp(W * 0.62, 300, 460));
    canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const bestCache = {};
  const best = {
    get(k) {
      if (!(k in bestCache)) {
        try { bestCache[k] = Number(localStorage.getItem('nine-lives-best-' + k)) || 0; } catch (e) { bestCache[k] = 0; }
      }
      return bestCache[k];
    },
    set(k, v) {
      bestCache[k] = v;
      try { localStorage.setItem('nine-lives-best-' + k, String(v)); } catch (e) {}
    }
  };

  /* ---------- drawing helpers ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function text(str, x, y, size, color, outline, font = DISPLAY, align = 'center') {
    ctx.font = `${size}px ${font}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.22; ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function wrapText(str, x, y, maxW, size, color, font = BODY) {
    ctx.font = `${size}px ${font}`;
    const lines = []; let line = '';
    for (const word of str.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = word; } else line = t;
    }
    if (line) lines.push(line);
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * 1.35));
    return lines.length * size * 1.35;
  }

  function drawCat(x, y, s, o = {}) {
    const fur = o.fur || C.marmalade;
    ctx.save(); ctx.translate(x, y);
    for (const side of [-1, 1]) {
      ctx.fillStyle = fur;
      ctx.beginPath(); ctx.moveTo(side * s * 0.95, -s * 0.2); ctx.lineTo(side * s * 0.78, -s * 1.25); ctx.lineTo(side * s * 0.18, -s * 0.82); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.pink;
      ctx.beginPath(); ctx.moveTo(side * s * 0.8, -s * 0.38); ctx.lineTo(side * s * 0.74, -s * 1.0); ctx.lineTo(side * s * 0.38, -s * 0.76); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.88, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.stripe; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
    for (const i of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(i * s * 0.24, -s * 0.8); ctx.lineTo(i * s * 0.17, -s * 0.52); ctx.stroke(); }
    const ex = s * 0.38, ey = -s * 0.08, er = s * 0.22;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(side * ex, ey);
      if (o.blink) {
        ctx.strokeStyle = C.ink; ctx.lineWidth = s * 0.07;
        ctx.beginPath(); ctx.arc(0, -er * 0.3, er * 0.8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      } else {
        ctx.fillStyle = C.eye; ctx.beginPath(); ctx.ellipse(0, 0, er, er * 1.05, 0, 0, Math.PI * 2); ctx.fill();
        let px = 0, py = 0;
        if (o.look) {
          const dx = o.look.x - (x + side * ex), dy = o.look.y - (y + ey);
          const d = Math.hypot(dx, dy) || 1;
          px = dx / d * er * 0.42; py = dy / d * er * 0.42;
        }
        const pw = o.pupil == null ? 0.25 : o.pupil;
        ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(px, py, er * pw, er * 0.82, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.fur; ctx.beginPath(); ctx.arc(px + er * 0.25, py - er * 0.35, er * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.moveTo(-s * 0.1, s * 0.2); ctx.lineTo(s * 0.1, s * 0.2); ctx.lineTo(0, s * 0.32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.32); ctx.quadraticCurveTo(-s * 0.08, s * 0.46, -s * 0.2, s * 0.38);
    ctx.moveTo(0, s * 0.32); ctx.quadraticCurveTo(s * 0.08, s * 0.46, s * 0.2, s * 0.38);
    ctx.stroke();
    ctx.strokeStyle = C.fur; ctx.lineWidth = Math.max(1, s * 0.025);
    for (const side of [-1, 1]) for (const k of [-1, 0, 1]) {
      ctx.beginPath(); ctx.moveTo(side * s * 0.32, s * 0.27 + k * s * 0.06); ctx.lineTo(side * s * 1.25, s * 0.2 + k * s * 0.17); ctx.stroke();
    }
    ctx.restore();
  }

  function drawLoaf(cx, b, w, o = {}) {
    const h = w * 0.5;
    ctx.strokeStyle = C.marmalade; ctx.lineWidth = w * 0.09; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - w * 0.4, b - h * 0.35); ctx.quadraticCurveTo(cx - w * 0.66, b - h * 0.05, cx - w * 0.28, b - h * 0.06); ctx.stroke();
    ctx.fillStyle = C.marmalade;
    ctx.beginPath(); ctx.ellipse(cx, b - h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.stripe; ctx.lineWidth = w * 0.035;
    for (const off of [-0.28, -0.13, 0.02]) {
      ctx.beginPath(); ctx.moveTo(cx + off * w, b - h * 0.97); ctx.quadraticCurveTo(cx + off * w - w * 0.04, b - h * 0.76, cx + off * w, b - h * 0.56); ctx.stroke();
    }
    drawCat(cx + w * 0.3, b - h * 0.9, w * 0.2, o);
  }

  function drawPaw(x, y, r, a) {
    ctx.globalAlpha = a * 0.85; ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    for (const [tx, ty] of [[-0.58, -0.35], [-0.2, -0.72], [0.2, -0.72], [0.58, -0.35]]) {
      ctx.beginPath(); ctx.ellipse(x + tx * r, y + ty * r, r * 0.2, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- shared effects ---------- */
  const fx = {
    pops: [], parts: [], paws: [],
    reset() { this.pops = []; this.parts = []; this.paws = []; },
    pop(x, y, t, color, size) { this.pops.push({ x, y, t, color, size, life: 1 }); },
    burst(x, y, n, colors) {
      if (calm) return;
      for (let i = 0; i < n; i++) this.parts.push({ x, y, vx: rnd(-170, 170), vy: rnd(-280, -60), life: rnd(0.5, 0.9), r: rnd(2, 5), c: pick(colors) });
    },
    update(dt) {
      for (const p of this.pops) { p.life -= dt * 0.9; p.y -= 30 * dt; }
      this.pops = this.pops.filter(p => p.life > 0);
      for (const p of this.parts) { p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
      this.parts = this.parts.filter(p => p.life > 0);
      for (const p of this.paws) p.life -= dt;
      this.paws = this.paws.filter(p => p.life > 0);
    },
    draw() {
      for (const p of this.parts) { ctx.globalAlpha = clamp(p.life * 1.5, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
      ctx.globalAlpha = 1;
      for (const p of this.paws) drawPaw(p.x, p.y, p.r, clamp(p.life / 0.6, 0, 1));
      for (const p of this.pops) { ctx.globalAlpha = clamp(p.life * 1.6, 0, 1); text(p.t, p.x, p.y, p.size, p.color, C.night); }
      ctx.globalAlpha = 1;
    }
  };

  /* ---------- Game 1: Knock It Off ---------- */
  const KINDS = {
    mug:   { w: 1.0, h: 0.95, pts: 2, sound: 'CLONK' },
    plant: { w: 1.0, h: 1.7,  pts: 2, sound: 'THUD' },
    glass: { w: 0.7, h: 1.25, pts: 3, sound: 'SMASH' },
    vase:  { w: 0.9, h: 1.6,  pts: 3, sound: 'CRASH' },
    phone: { w: 0.6, h: 1.05, pts: 2, sound: 'CRACK' },
    yarn:  { w: 0.9, h: 0.9,  pts: 1, sound: 'boing' }
  };
  function drawItem(kind, x, b, s, rot) {
    const k = KINDS[kind], w = k.w * s, h = k.h * s;
    ctx.save(); ctx.translate(x, b); ctx.rotate(rot);
    if (kind === 'mug') {
      ctx.strokeStyle = C.fur; ctx.lineWidth = s * 0.13;
      ctx.beginPath(); ctx.arc(w * 0.32, -h * 0.5, h * 0.24, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.fillStyle = C.fur; rr(-w / 2, -h, w * 0.82, h, s * 0.12); ctx.fill();
      ctx.fillStyle = C.wood; ctx.fillRect(-w / 2 + s * 0.08, -h + s * 0.07, w * 0.82 - s * 0.16, s * 0.12);
    } else if (kind === 'plant') {
      ctx.fillStyle = C.leaf;
      for (const [lx, ly, a] of [[-0.25, -1.25, -0.5], [0.25, -1.25, 0.5], [0, -1.45, 0]]) {
        ctx.beginPath(); ctx.ellipse(lx * s, ly * s, s * 0.18, s * 0.42, a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = C.stripe;
      ctx.beginPath(); ctx.moveTo(-w / 2, -h * 0.5); ctx.lineTo(w / 2, -h * 0.5); ctx.lineTo(w * 0.36, 0); ctx.lineTo(-w * 0.36, 0); ctx.closePath(); ctx.fill();
    } else if (kind === 'glass') {
      ctx.fillStyle = C.glass; ctx.fillRect(-w / 2, -h, w, h);
      ctx.strokeStyle = C.fur; ctx.lineWidth = 1.5; ctx.strokeRect(-w / 2, -h, w, h);
      ctx.fillStyle = C.vase; ctx.globalAlpha = 0.5; ctx.fillRect(-w / 2 + 1, -h * 0.55, w - 2, h * 0.55 - 1); ctx.globalAlpha = 1;
    } else if (kind === 'vase') {
      ctx.fillStyle = C.vase;
      ctx.beginPath(); ctx.moveTo(-w * 0.22, -h); ctx.lineTo(w * 0.22, -h);
      ctx.bezierCurveTo(w * 0.2, -h * 0.7, w * 0.62, -h * 0.5, w * 0.36, 0);
      ctx.lineTo(-w * 0.36, 0); ctx.bezierCurveTo(-w * 0.62, -h * 0.5, -w * 0.2, -h * 0.7, -w * 0.22, -h);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.fur; ctx.lineWidth = s * 0.06;
      ctx.beginPath(); ctx.moveTo(-w * 0.38, -h * 0.4); ctx.lineTo(w * 0.38, -h * 0.4); ctx.stroke();
    } else if (kind === 'phone') {
      ctx.fillStyle = C.ink; rr(-w / 2, -h, w, h, s * 0.1); ctx.fill();

  const Knock = {
    key: 'knock', title: 'Knock It Off',
    pitch: 'Swat everything off the shelf. Freeze when the human turns around.',
    rules: 'Tap or click things on the shelf to swat them onto the floor. Glasses and vases are worth 3 points, mugs, plants and phones 2, yarn 1. When the human turns to face you, stop. Get caught three times and you are banished to the bathroom. 30 seconds.',
    reset() {
      this.score = 0; this.time = 30; this.strikes = 0; this.over = false; this.banished = false;

    },
    make(slot) { return { slot, kind: pick(Object.keys(KINDS)), wob: 0 }; },
    s() { return unit() * 0.065; },
    shelfY() { return H * 0.64; },
    slotX(i) { const l = W * 0.07, r = W * 0.76; return l + (i + 0.5) * (r - l) / 5; },
    hud() { return [['Score', this.score], ['Time', Math.ceil(this.time) + 's'], ['Strikes', this.strikes + ' / 3']]; },
    humanTick(dt) {
      const h = this.human; h.t -= dt;

    },
    idle(dt) { this.humanTick(dt); },
    update(dt) {
      this.time -= dt;
      if (this.time <= 0) { this.time = 0; this.over = true; }

      this.caught = Math.max(0, this.caught - dt);

      for (const r of this.respawn) { r.t -= dt; if (r.t <= 0) { r.done = true; this.items.push(this.make(r.slot)); } }

    tap(x, y) {

  /* ---------- Game 2: Laser Pounce ---------- */
  const Laser = {

  /* ---------- Game 3: If It Fits, I Sits ---------- */
  const GRADES = [
    { max: 0.86, label: 'Loaf overflow', pts: 40, note: 'Half in. Fully committed.', sink: 0.12 },
    { max: 0.97, label: 'Snug squish', pts: 90, note: 'Tight is right.', sink: 0.55 },
    { max: 1.08, label: 'Perfect fit', pts: 100, note: 'If I fits, I sits.', sink: 0.72 },
    { max: 1.2, label: 'Roomy', pts: 50, note: 'Acceptable. Will knead first.', sink: 0.9 },
    { max: 99, label: 'Too much box', pts: 15, note: 'The cat sank. Only the ears remain.', sink: 1.35 }
  ];
  const Box = {
    key: 'box', title: 'If It Fits, I Sits',
    pitch: 'The box keeps changing size. Jump in when it fits just right.',
    rules: 'The box grows and shrinks. Tap or click to jump in; the dashed lines show how wide the cat is. A perfect fit scores 100 and a snug squeeze 90, because cats like snug. An oversized box barely counts. Five boxes, each one faster.',
    reset() { this.score = 0; this.round = 0; this.perfect = 0; this.over = false; this.newRound(); },
    newRound() { this.cat = rnd(0.82, 1); this.speed = 1.7 + this.round * 0.5; this.t = rnd(0, 10); this.state = 'swing'; this.drop = 0; this.hold = 0; this.result = null; },
    ratio() { return 0.72 + 0.62 * (0.5 + 0.5 * Math.sin(this.t * this.speed)); },
    idle(dt) { if (this.state === 'swing') this.t += dt * 0.6; },

    tap() {

      fx.pop(W / 2, H * 0.3, '+' + g.pts, C.eye, 24);
    },
    hud() { return [['Score', this.score], ['Box', Math.min(this.round + 1, 5) + ' / 5'], ['Perfect', this.perfect]]; },
    quip() {
      const s = this.score;
      if (s < 200) return 'The boxes were all wrong. Obviously.';
      if (s < 350) return 'Decent sits. Some loafing.';
      if (s < 460) return 'Elite box judge.';
      return 'Flawless. Every box claimed.';
    },
    draw() {
      const u = unit();
      ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, H);

      const catW = u * 0.3 * this.cat, catH = catW * 0.5;
      const r = this.state === 'swing' ? this.ratio() : this.result.r;
      const boxW = catW * r, boxH = catW * 0.42, bx = W / 2, boxTop = floorY - boxH, L = bx - boxW / 2, R = bx + boxW / 2;
      const fh = boxH * 0.6;
      const hover = boxTop - fh - catH * 0.15 + (calm ? 0 : Math.sin(performance.now() / 300) * 3);
      let catBottom = hover;
      if (this.state === 'result') {
        const e = 1 - Math.pow(1 - this.drop, 3);

      ctx.fillStyle = C.fur; ctx.globalAlpha = 0.35; ctx.fillRect(bx - boxW * 0.05, boxTop, boxW * 0.1, boxH * 0.45); ctx.globalAlpha = 1;

        text(this.result.label, W / 2, H * 0.1, clamp(u * 0.065, 20, 34), C.marmalade, C.night);
        wrapText(this.result.note, W / 2, H * 0.1 + clamp(u * 0.065, 20, 34) * 0.95, W * 0.8, clamp(u * 0.03, 13, 17), C.fur);

  /* ---------- Game 4: Catch the Sun ---------- */
  const Sun = {
    key: 'sun', title: 'Catch the Sun',
    pitch: 'Find the warm patch of sunlight on the floor. Stay in it as long as you can.',
    rules: 'Walk the cat into the patch of sunlight and stay there. Point, drag or tap where you want to go, or use the arrow keys. The sun drifts across the floor, and when a cloud passes the patch disappears and comes back somewhere else, so go find it. Every time it comes back, it moves faster. Out of the sun the cat gets cold; when Warmth hits zero, the nap is over. 10 points for every second in the sun. It gets harder the longer you last.',
    reset() {
      this.score = 0; this.sunT = 0; this.time = 0; this.warmth = 1; this.over = false;

    tap(x, y) { this.aim(x, y); },
    steer(k, down) {
      const map = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'dn', s: 'dn', S: 'dn' };

      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = '#' + (i + 1);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = s.score;
      li.append(rk, nm, sc); boardList.append(li);
    });
  }
  async function loadBoard(key) {
    const id = ++boardReq;
    boardTitle.textContent = 'Top 10: ' + GAMES[key].title;
    boardList.textContent = ''; say(boardMsg, 'Loading scores…');
    try {
      const r = await fetch(API + '?game=' + key, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (id === boardReq) renderBoard(d.scores || []);
    } catch (e) {
      if (id === boardReq) say(boardMsg, 'The leaderboard is offline right now. Your personal best is still saved on this device.', true);
    }
  }
  function offerSubmit(key, score) {
    pending = { key, score };
    submitScore.textContent = score; say(submitMsg, ''); submitBtn.disabled = false;
    form.hidden = false;
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pending) return;
    const name = nick.value.trim();
    if (!name) { say(submitMsg, 'Type a nickname first.', true); return; }
    try { localStorage.setItem('nine-lives-nick', name); } catch (err) {}
    const entry = pending;
    submitBtn.disabled = true; say(submitMsg, 'Saving…');
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ game: entry.key, name, score: entry.score }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { say(submitMsg, d.error || 'Your score was not saved. Try again.', true); submitBtn.disabled = false; return; }
      if (pending === entry) pending = null;
      say(submitMsg, d.rank && d.rank <= 10 ? 'Saved. You are #' + d.rank + '!' : d.rank ? 'Saved at #' + d.rank + '. The top 10 needs a little more chaos.' : 'Saved, but it did not make the top 50 this time.');
      if (entry.key === cur.key) { boardReq++; boardTitle.textContent = 'Top 10: ' + cur.title; renderBoard(d.scores || [], d.rank); }
    } catch (err) {
      say(submitMsg, 'Could not reach the leaderboard. Check your connection and try again.', true); submitBtn.disabled = false;
    }
  });

  function select(key) {
    if (!GAMES[key]) key = 'knock';
    cur = GAMES[key]; phase = 'ready'; fx.reset(); cur.reset(); hudSig = '';
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.game === key)));
    document.getElementById('rules-title').textContent = 'How to play ' + cur.title;
    document.getElementById('rules').textContent = cur.rules;
    form.hidden = true;
    loadBoard(key);
  }
  function start() { fx.reset(); cur.reset(); phase = 'play'; newBest = false; }
  function end() {
    phase = 'over'; endAt = performance.now();
    if (cur.score > best.get(cur.key)) { best.set(cur.key, cur.score); newBest = cur.score > 0; }
    if (cur.score > 0) offerSubmit(cur.key, cur.score);
  }
  function canStart() { return phase === 'ready' || (phase === 'over' && performance.now() - endAt > 700); }

  let swipe = null;
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const { x, y } = pos(e);
    if (phase === 'play') { if (cur.move) swipe = { x, y }; else cur.tap(x, y); }
    else if (canStart()) start();
  });
  canvas.addEventListener('pointerup', e => {
    if (!swipe) return;
    const { x, y } = pos(e), s = swipe; swipe = null;
    if (phase !== 'play' || !cur.move) return;
    const dx = x - s.x, dy = y - s.y;
    if (Math.hypot(dx, dy) > 24) cur.move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    else cur.tap(x, y);
  });
  canvas.addEventListener('pointercancel', () => { swipe = null; });
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  document.addEventListener('keydown', e => {
    const dir = KEYS[e.key];
    if (!dir || !cur.move || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    e.preventDefault();
    if (phase === 'play') cur.move(dir);
    else if (canStart()) start();
  });
  canvas.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (phase === 'play' && cur === Box) cur.tap();
    else if (phase !== 'play' && canStart()) start();
  });

  canvas.addEventListener('pointermove', e => {
    if (phase !== 'play' || !cur.aim) return;
    if (e.pointerType !== 'mouse' && !e.buttons) return;
    const r = canvas.getBoundingClientRect();
    cur.aim(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('keyup', e => { if (typeof cur.steer === 'function') cur.steer(e.key, false); });
  canvas.addEventListener('blur', () => { if (cur.keys) cur.keys = {}; });
  canvas.addEventListener('keydown', e => {
    if (phase === 'play' && typeof cur.steer === 'function' && cur.steer(e.key, true)) { e.preventDefault(); return; }
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (phase === 'play' && cur === Box) cur.tap();
    else if (phase !== 'play' && canStart()) start();
  });
  tabs.forEach(tab => tab.addEventListener('click', () => {
    const k = tab.dataset.game;
    if (location.hash === '#' + k) select(k); else location.hash = k;
  }));
  window.addEventListener('hashchange', () => select(location.hash.slice(1)));
  window.addEventListener('resize', resize);

  function overlay() {
    ctx.fillStyle = C.scrim; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, big = clamp(W * 0.075, 26, 48), small = clamp(W * 0.032, 14, 18), maxW = Math.min(W * 0.82, 460);
    if (phase === 'ready') {
      text(cur.title, cx, H * 0.32, big, C.marmalade, C.night);
      wrapText(cur.pitch, cx, H * 0.32 + big * 0.95, maxW, small, C.fur);
      text(tapWord + ' to start', cx, H * 0.76, clamp(W * 0.042, 17, 24), C.eye, C.night);
    } else {
      ctx.fillRect(0, 0, W, H);
      text('Final score', cx, H * 0.17, small, C.muted, null, BODY);
      text(String(cur.score), cx, H * 0.31, big * 1.2, C.marmalade, C.night);
      wrapText(cur.quip(), cx, H * 0.47, maxW, small, C.fur);
      if (newBest) text('New best', cx, H * 0.64, clamp(W * 0.036, 15, 20), C.eye, C.night);
      if (canStart()) text(tapWord + ' to play again', cx, H * 0.8, clamp(W * 0.042, 17, 24), C.eye, C.night);
      if (cur.score > 0) text('Add your score to the leaderboard below', cx, H * 0.91, small * 0.9, C.muted, null, BODY);
    }
  }

  function hud() {
    const rows = cur.hud().concat([['Best', best.get(cur.key)]]);
    const sig = JSON.stringify(rows);
    if (sig === hudSig) return;
    hudSig = sig;
    rows.forEach(([l, v], i) => { hudEls[i][0].textContent = l; hudEls[i][1].textContent = v; });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (phase === 'play') { cur.update(dt); if (cur.over) end(); }
    else if (phase === 'ready' && cur.idle) cur.idle(dt);
    fx.update(dt);
    ctx.clearRect(0, 0, W, H);
    cur.draw();
    fx.draw();
    if (phase !== 'play') overlay();
    hud();
    requestAnimationFrame(frame);
  }

  resize();
  select(location.hash.slice(1) || 'knock');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
